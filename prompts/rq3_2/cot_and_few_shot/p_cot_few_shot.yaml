- name: few_shot_example_feat_fix_3
  role: user
  content: |
    commit message: try to fallback native bindings with MODULE_NOT_FOUND

    Summary:
    Introduces a fallback mechanism to dynamically download and load native SWC bindings when they are missing, instead of failing immediately. This improves robustness across environments with mismatched dependencies.

    Relevant diff:
    + import { downloadWasmSwc, downloadNativeNextSwc } from '../../lib/download-swc'
    ...
    + let fallbackBindings = await tryLoadNativeWithFallback(...)
    + if (fallbackBindings) {
    +   return resolve(fallbackBindings)
    + }
    ...
    + async function tryLoadNativeWithFallback(...) {
    +   await downloadNativeNextSwc(...)
    +   let bindings = loadNative(...)
    +   return bindings
    + }
  activate: true


- name: few_shot_example_feat_fix_3_answer
  role: assistant
  content: |
    classification: feat
    breaking_change: False
    reason: The change introduces a new fallback mechanism that dynamically downloads and loads native bindings when they are missing. This adds new functionality and improves robustness, rather than simply correcting existing behavior.
  activate: true

