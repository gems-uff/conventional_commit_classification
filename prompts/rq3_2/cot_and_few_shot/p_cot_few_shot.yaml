- name: few_shot_example_1
  role: user
  content: |
    commit message: support console.dir options object correctly

    Summary:
    Corrects incomplete handling of console.dir options. Previously, options like depth and colors were not processed correctly.

    Relevant diff:
    + if (opts.get(global, "depth")) |depth_prop| {
    +   print_options.max_depth = depth_prop.toU16();
    + }
  activate: true


- name: few_shot_example_1_answer
  role: assistant
  content: |
    classification: fix
    breaking_change: False
    reason: The change corrects incomplete behavior in handling existing console.dir options, ensuring expected functionality rather than introducing a new feature.
  activate: true

