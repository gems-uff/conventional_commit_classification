version: 1
id: rq4_within_corpus
research_question: rq4_1
description: >
  Compare GPT-OSS, FLACCS, HQCM, TF-IDF + Linear SVM, BiLSTM, and CodeBERT
  on the same complete 11-class task using a stratified 80/20 within-corpus
  holdout without repository-level grouping.

shared:
  # Reconciled 2026-09-12 (see TODO.md item 2): the previous expected_rows/hash
  # (1630, caeb18013eded7c66125126767702594d7856d5b40faecfb9ad55aa405fe479c) 
  # matched a stale GPT-OSS prediction cohort computed against an older
  # snapshot of the corpus. The value below (1632) matches the article
  # (main.tex:663, "6,527 training commits and 1,632 test commits") and was
  # confirmed member-for-member (not just by count) against the legacy
  # rq4_non_cross_v2_package's own dataset/rq4_v2_from_md_11classes/
  # within_corpus/test.csv via a matching cohort_sha256. Regenerating the
  # stale frozen predictions in results/rq4_1/within_corpus/ against
  # this cohort is still pending (TODO.md item 2) and unaffected by this
  # config value; this only unblocks the preflight for new runs (trainable
  # baselines and any fresh GPT-OSS/FLACCS/HQCM execution) against the
  # correct cohort.
  expected_rows: 1632
  expected_cohort_sha256: cc25059fa0b2597e5f07bef599158e45ae627d49562597bdcca486c936bc8256
  dataset: data/pre_cutoff/commits.csv.gz
  representation: message_and_diff
  initial_seeds: [10, 20, 30]
  adaptive_policy: {start: 40, step: 10}
  consensus:
    method: first_to_two
    threshold: 2
  metric:
    primary: macro_f1
    statistical_unit: project

split:
  protocol: within_corpus_holdout
  assignments: data/rq4_1/within_corpus/assignments.csv
  train_fraction: 0.8
  test_fraction: 0.2
  stratify_by: target
  random_seed: 42
  grouping_unit: none

conditions:
  gpt_oss_20b:
    model: gpt_oss_20b
    prompt_id: p_code_disambiguation
    temperature: 0.6
    runtime_overrides:
      request_timeout_seconds: 300

  flaccs:
    model: 0x404/ccs-code-llama-7b
    prompt_id: p_flaccs_extended_11class
    inference:
      do_sample: false
      max_new_tokens: 10

  hqcm:
    adapter: chcl_llama2_7b_len1024
    prompt_id: p_hqcm_extended_11class
    temperature: 0.0
    label_normalization:
      cicd: ci

  tfidf_linear_svm:
    training_config: config/training/svm.yaml

  bilstm:
    training_config: config/training/bilstm.yaml

  codebert:
    training_config: config/training/codebert.yaml

analysis:
  pairing: project
  comparison: six_approaches
  statistical_procedure: config/evaluation.yaml
