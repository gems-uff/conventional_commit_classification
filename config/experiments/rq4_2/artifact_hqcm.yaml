version: 1
id: rq4_artifact_hqcm
research_question: rq4_2
description: >
  Compare GPT-OSS with CodeFuse HQCM on the HQCM-compatible subset,
  preserving the artifact's native 8-class task, native zero-shot prompt,
  and 1,024-token input constraint.

shared:
  dataset: data/pre_cutoff/commits.csv.gz
  representation: message_and_diff
  initial_seeds: [10, 20, 30]
  adaptive_policy: {start: 40, step: 10}
  consensus:
    method: first_to_two
    threshold: 2
  metric:
    primary: macro_f1
    statistical_unit: project

subset:
  assignments: data/rq4_2/artifact_compatible/hqcm/assignments.csv
  materializer: scripts/rq4_2/materialize_hqcm_artifact.py
  label_space: [fix, feat, build, ci, docs, style, refactor, test]
  context_window_tokens: 1024
  label_normalization:
    cicd: ci

conditions:
  hqcm:
    adapter: chcl_llama2_7b_len1024
    prompt_id: p_hqcm_native_8class
    temperature: 0.0

  gpt_oss_20b:
    model: gpt_oss_20b
    prompt_id: p_winner_adapted_to_hqcm
    temperature: 0.6
    runtime_overrides:
      request_timeout_seconds: 300
    input_constraint:
      context_window_tokens: 1024

analysis:
  pairing: project
  comparison: gpt_oss_20b_vs_hqcm
  statistical_procedure: config/evaluation.yaml
