version: 1
model: bilstm

architecture:
  max_vocab_size: 50000
  # Maximum input length in tokens (src/training/bilstm.py, tokenize()).
  max_seq_len: 10000
  embedding_dim: 128
  hidden_dim: 128
  num_layers: 1
  dropout: 0.3
  batch_size: 32
  learning_rate: 1.0e-3
  weight_decay: 1.0e-5
  gradient_clip_norm: 1.0

# num_epochs is chosen once per fold/holdout by early stopping on an internal
# validation split of that fold's training partition, then reused for every seed.
model_selection:
  method: early_stopping
  metric: macro_f1
  max_epochs: 30
  patience: 3
  validation:
    fraction: 0.15
    stratify: true
