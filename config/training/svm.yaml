version: 1
model: tfidf_linear_svm

# TF-IDF has no fixed input-length limit: unigram/bigram counts are computed over
# the entire message-and-diff text regardless of length, unlike BiLSTM/CodeBERT.
tfidf:
  max_features: 50000
  ngram_range: [1, 2]
  min_df: 2
  max_df: 0.95
  sublinear_tf: true
  lowercase: true

svm:
  penalty: l2
  loss: squared_hinge
  dual: true
  tol: 1.0e-4
  max_iter: 5000
  class_weight: balanced

# C was previously a fixed, unvalidated default (1.0). It is now chosen once per
# fold/holdout via a small grid search on an internal validation split carved
# from that fold's training partition (never the test partition), and reused,
# fixed, across every seed's from-scratch fit used for consensus.
model_selection:
  method: grid_search
  hyperparameter: C
  grid: [0.01, 0.1, 1.0, 10.0, 100.0]
  metric: macro_f1
  validation:
    fraction: 0.15
    stratify: true
